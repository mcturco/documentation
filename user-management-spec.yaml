openapi: 3.1.0

info:
  title: User Management API
  version: 1.0.1
  description: |
    API specification reconstructed from the Kong Gateway service
    `sample-user-management-api`.

    The operations and schemas in this document are inferred examples and
    should be validated against the Kong Routes and upstream application.

servers:
  - url: https://a698fecaa2.us.serverless.gateways.konggateway.com
    description: Production

tags:
  - name: Users
    description: Create, retrieve, update, and delete users

paths:
  /users:
    get:
      operationId: listUsers
      summary: List users
      tags:
        - Users
      parameters:
        - name: limit
          in: query
          description: Maximum number of users to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: Number of users to skip
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      operationId: createUser
      summary: Create a user
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created successfully
          headers:
            Location:
              description: URL of the newly created user
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: A user with the supplied email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"

    get:
      operationId: getUser
      summary: Retrieve a user
      tags:
        - Users
      responses:
        "200":
          description: User retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    patch:
      operationId: updateUser
      summary: Update a user
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The updated email is already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      operationId: deleteUser
      summary: Delete a user
      tags:
        - Users
      responses:
        "204":
          description: User deleted successfully
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /health:
    get:
      operationId: getHealth
      summary: Check service health
      tags:
        - Health
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

components:
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: Unique identifier for the user
      schema:
        type: string
        format: uuid

  schemas:
    User:
      type: object
      required:
        - id
        - email
        - name
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          examples:
            - 7ad52af7-f455-4d41-8974-123456789abc
        email:
          type: string
          format: email
          examples:
            - taylor@example.com
        name:
          type: string
          minLength: 1
          examples:
            - Taylor Morgan
        status:
          type: string
          enum:
            - active
            - inactive
            - suspended
          examples:
            - active
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required:
        - email
        - name
      properties:
        email:
          type: string
          format: email
          examples:
            - taylor@example.com
        name:
          type: string
          minLength: 1
          examples:
            - Taylor Morgan
        status:
          type: string
          enum:
            - active
            - inactive
          default: active

    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - active
            - inactive
            - suspended

    UserList:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        pagination:
          $ref: "#/components/schemas/Pagination"

    Pagination:
      type: object
      required:
        - limit
        - offset
        - total
      properties:
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0

    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - healthy
          examples:
            - healthy

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          examples:
            - USER_NOT_FOUND
        message:
          type: string
          examples:
            - The requested user could not be found.
        details:
          type:
            - object
            - "null"
          additionalProperties: true

  responses:
    BadRequest:
      description: The request is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: The requested resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InternalServerError:
      description: An unexpected error occurred
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
